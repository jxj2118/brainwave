[package]
name = "brainwave-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jxj2118/brainwave"
homepage = "https://brainwave.lor4ai.com"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
git2 = { version = "0.21", default-features = false }
tempfile = "3"
libc = "0.2"

pulldown-cmark = "0.13"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
aes-gcm = "0.10"
